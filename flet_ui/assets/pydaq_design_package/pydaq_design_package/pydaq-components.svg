<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <style>text{font-family:Arial,sans-serif;fill:#102342}.title{font-size:32px;font-weight:700}.h{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px}.muted{fill:#71809A}</style>
  <rect width="1440" height="980" fill="#F7F9FC"/>
  <text class="title" x="56" y="70">PyDAQ component library</text><text class="body muted" x="56" y="98">Editable source elements for Figma, Penpot and Inkscape.</text>
  <g id="buttons" transform="translate(56 145)"><text class="h" y="0">Buttons</text><rect y="24" width="260" height="52" rx="8" fill="#B56C70"/><text x="56" y="57" fill="#fff" font-size="16" font-weight="700">▶  Start acquisition</text><rect x="280" y="24" width="110" height="52" rx="8" fill="#F1F4F8" stroke="#DFE5EF"/><text x="306" y="56" class="body">Browse</text></g>
  <g id="inputs" transform="translate(56 285)"><text class="h">Inputs</text><text class="small" y="42">Device</text><rect y="53" width="460" height="44" rx="8" fill="#fff" stroke="#CBD4E1"/><text x="16" y="81" class="body">COM3 · Arduino Uno</text><text x="430" y="81" class="body">⌄</text><text class="small" x="500" y="42">Path</text><rect x="500" y="53" width="460" height="44" rx="8" fill="#fff" stroke="#CBD4E1"/><text x="516" y="81" class="body">~/Documents/PYDAQ</text></g>
  <g id="segmented" transform="translate(56 442)"><text class="h">Segmented controls</text><rect y="24" width="320" height="44" rx="8" fill="#fff" stroke="#CBD4E1"/><rect y="24" width="112" height="44" rx="8" fill="#B56C70"/><line x1="112" y1="24" x2="112" y2="68" stroke="#CBD4E1"/><line x1="220" y1="24" x2="220" y2="68" stroke="#CBD4E1"/><text x="25" y="52" fill="#fff" class="small" font-weight="700">Real time</text><text x="132" y="52" class="small">At the end</text><text x="252" y="52" class="small">Off</text></g>
  <g id="switches" transform="translate(510 442)"><text class="h">Switches</text><rect y="24" width="54" height="31" rx="16" fill="#AAB5C5"/><circle cx="16" cy="39.5" r="12" fill="#fff"/><text x="68" y="45" class="body">Off</text><rect x="150" y="24" width="54" height="31" rx="16" fill="#B56C70"/><circle cx="188" cy="39.5" r="12" fill="#fff"/><text x="218" y="45" class="body">On</text></g>
  <g id="nav-items" transform="translate(56 590)"><text class="h">Navigation items</text><rect y="24" width="240" height="54" rx="8" fill="#F8EFF0"/><rect y="24" width="5" height="54" rx="3" fill="#B56C70"/><text x="24" y="58" font-size="22" fill="#B56C70">▥</text><text x="63" y="58" font-size="16" fill="#B56C70" font-weight="700">Get Data</text><rect x="260" y="24" width="240" height="54" rx="8" fill="#fff"/><text x="284" y="58" font-size="22" fill="#71809A">➤</text><text x="323" y="58" class="body muted">Send Data</text></g>
  <g id="cards" transform="translate(56 740)"><text class="h">Cards</text><rect y="24" width="600" height="160" rx="12" fill="#fff" stroke="#DFE5EF"/><text x="24" y="62" class="h">Card title</text><text x="24" y="89" class="body muted">Supporting description for the panel.</text><rect x="24" y="112" width="552" height="48" rx="8" fill="#FAFBFD" stroke="#CBD4E1"/></g>
