    <g transform="translate(0 205)"><rect width="120" height="72" rx="8" fill="#F8EFF0" stroke="#DFE5EF"/><text x="135" y="28" class="body">Accent soft</text><text x="135" y="52" class="small muted">#F8EFF0</text></g>
    <g transform="translate(0 295)"><rect width="120" height="72" rx="8" fill="#F7F9FC" stroke="#DFE5EF"/><text x="135" y="28" class="body">Background</text><text x="135" y="52" class="small muted">#F7F9FC</text></g>
    <g transform="translate(0 385)"><rect width="120" height="72" rx="8" fill="#148A2E"/><text x="135" y="28" class="body">Success</text><text x="135" y="52" class="small muted">#148A2E</text></g>
